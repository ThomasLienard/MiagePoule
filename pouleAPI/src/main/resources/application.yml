spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/miagepoule
    username: miageuser
    password: miagepassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8080
