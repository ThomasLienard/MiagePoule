spring.application.name=spring gateway

server.port=8080

# Microservice upstream URLs (used by GatewayConfig)
service.auth.url=http://localhost:8081
service.kernel.url=http://localhost:8082
service.map.url=http://localhost:8083
service.planning.url=http://localhost:8084
service.report.url=http://localhost:8085
service.alerts.url=http://localhost:8086
service.crypto.url=http://localhost:8087

# Development security user (change in production)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=USER
