spring.application.name=pouleAPI
server.port=8082

# PostgreSQL datasource (update credentials as needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/miagepoule
spring.datasource.username=miageuser
spring.datasource.password=miagepassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect