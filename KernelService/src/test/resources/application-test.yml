spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true   # <- IMPORTANT

  sql:
    init:
      mode: always                          # <- IMPORTANT
      data-locations: classpath:data.sql    # <- IMPORTANT

security:
  jwt:
    secret: test-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
    expiration: 86400000
