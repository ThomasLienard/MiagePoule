spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: false
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      separator: ;
      continue-on-error: false

  # Désactive l'envoi d'emails et les threads asynchrones pendant les tests
  mail:
    host: localhost
    port: 3025
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000
  
  task:
    execution:
      shutdown:
        await-termination: true
        await-termination-period: 5s

security:
  jwt:
    secret: test-secret-key-1234567890-abcdefghijklmnopqrstuvwxyz
    expiration: 86400000
