version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres_miagepoule
    environment:
      POSTGRES_DB: miagepoule
      POSTGRES_USER: miageuser
      POSTGRES_PASSWORD: miagepassword
    ports:
      - "5433:5432"  # Changé de 5432 à 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - miage-network
    restart: unless-stopped

  # API Spring Boot
  poule-api:
    build:
      context: ./KernelService
      dockerfile: Dockerfile
    container_name: spring_miagepoule
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miagepoule
      SPRING_DATASOURCE_USERNAME: miageuser
      SPRING_DATASOURCE_PASSWORD: miagepassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    networks:
      - miage-network
    restart: unless-stopped

  # Frontend React Native (Node.js 22)
  frontend:
    build: ./front
    container_name: react_miagepoule
    ports:
      - "3000:3000"
    networks:
      - miage-network
    restart: unless-stopped

  cerberus-mysql:
    image: mysql:8.0
    container_name: cerberus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cerberus
      MYSQL_USER: cerberus
      MYSQL_PASSWORD: cerberus
    ports:
      - "3307:3306"
    volumes:
      - cerberus_mysql_data:/var/lib/mysql
    networks:
      - miage-network

  cerberus:
    build:
      context: ./cerberus
      dockerfile: Dockerfile
    container_name: cerberus
    depends_on:
      - cerberus-mysql
    ports:
      - "8082:8080"
    environment:
      CERBERUS_DB_HOST: cerberus-mysql
      CERBERUS_DB_PORT: 3306
      CERBERUS_DB_NAME: cerberus
      CERBERUS_DB_USER: cerberus
      CERBERUS_DB_PASSWORD: cerberus
    networks:
      - miage-network

volumes:
  postgres_data:
  cerberus_mysql_data:

networks:
  miage-network:
    driver: bridge