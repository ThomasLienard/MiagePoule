version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres_miagepoule
    environment:
      POSTGRES_DB: miagepoule
      POSTGRES_USER: miageuser
      POSTGRES_PASSWORD: miagepassword
    ports:
      - "5433:5432"
    networks:
      - miage-network
    restart: unless-stopped
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - miage-network
  # API Spring Boot
  poule-api:
    build:
      context: ./KernelService
      dockerfile: Dockerfile
    container_name: spring_miagepoule
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miagepoule
      SPRING_DATASOURCE_USERNAME: miageuser
      SPRING_DATASOURCE_PASSWORD: miagepassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8083:8082"
    depends_on:
      - postgres
    networks:
      - miage-network
    restart: unless-stopped

  # Frontend React Native (Node.js 22)
  frontend:
    build: ./front
    container_name: react_miagepoule
    ports:
      - "3000:3000"  # Un seul port exposé
    networks:
      - miage-network
    restart: unless-stopped

  cerberus-mysql:
    image: cerberustesting/cerberus-db-mysql
    container_name: cerberus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cerberus
      MYSQL_USER: cerberus
      MYSQL_PASSWORD: cerberus
    ports:
      - "3307:3306"
    volumes:
      - cerberus_mysql_data:/var/lib/mysql
    networks:
      - miage-network

  cerberus:
    image: cerberustesting/cerberus-as-tomcat
    container_name: cerberus
    depends_on:
      - cerberus-mysql
    environment:
      DATABASE_HOST: cerberus-mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: cerberus
      DATABASE_USER: cerberus
      DATABASE_PASSWORD: cerberus
      org.cerberus.environment: prd
      org.cerberus.authentification: none
    ports:
      - "8082:8080"
    networks:
      - miage-network

  selenium:
    image: selenium/standalone-firefox:4
    container_name: selenium
    ports:
      - "4444:4444"
    networks:
      - miage-network


volumes:
  postgres_data:
  cerberus_mysql_data:

networks:
  miage-network:
    driver: bridge