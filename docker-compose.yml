version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres_miagepoule
    environment:
      POSTGRES_DB: miagepoule
      POSTGRES_USER: miageuser
      POSTGRES_PASSWORD: miagepassword
    ports:
      - "5433:5432"
    networks:
      - miage-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 2s
      timeout: 5s
      retries: 5
  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
    networks:
      - miage-network
  # API Spring Boot
  poule-api:
    build:
      context: ./KernelService
      dockerfile: Dockerfile
    container_name: spring_miagepoule
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/miagepoule
      SPRING_DATASOURCE_USERNAME: miageuser
      SPRING_DATASOURCE_PASSWORD: miagepassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8085:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - miage-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/public/trials"]
      interval: 2s
      timeout: 5s
      retries: 15

  # API Spring Boot
  gateway-api:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: spring_miagepoule_gateway
    environment:
      SERVICE_BACKEND_URL: http://poule-api:8082
    ports:
      - "8084:8081"
    depends_on:
      poule-api:
        condition: service_healthy
    networks:
      - miage-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/public/trials" ]
      interval: 2s
      timeout: 5s
      retries: 15

  # Frontend
  frontend:
    build: ./front
    container_name: react_miagepoule
    depends_on:
      gateway-api:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - miage-network
    restart: unless-stopped

volumes:
  postgres_data:
  cerberus_mysql_data:

networks:
  miage-network:
    driver: bridge